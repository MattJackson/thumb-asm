# Version updates are monthly and grouped into one PR per ecosystem.
# Security updates are separate and run whenever an advisory is published.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
    day: monday
  target-branch: dev
  commit-message:
    prefix: ci
  groups:
    all:
      patterns:
      - '*'
